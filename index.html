<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McMethods Account Portal</title>
  <!-- Montserrat font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #b71c1c, #d32f2f, #fbc02d); /* McDonald's red → yellow */
    }

    .container {
      background: rgba(0,0,0,0.65);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      color: white;
      max-width: 400px;
      width: 90%;
    }

    .logo {
      width: 120px;
      height: auto;
      border-radius: 25px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
    }

    .button-container {
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      gap: 0.5rem;
      width: 100%;
      margin-top: auto;
    }

    .vertical-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .vertical-buttons a.button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
    }

    a.button {
      text-decoration: none;
      background: #fbc02d; /* McDonald's golden yellow */
      color: #b71c1c;       /* McDonald's deep red */
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.25s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      text-align: center;
      display: inline-block;
    }

    a.button:hover {
      background: #ffd54f;
      transform: scale(1.05);
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: rgba(0,0,0,0.9);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.8);
      color: white;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 2rem;
      cursor: pointer;
      color: #fbc02d;
    }

    .close-button:hover {
      color: #ffd54f;
    }
  </style>
</head>
<body>
  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h2>McMethods Announcement</h2>
      <p>McMethods x Monopoly is here! Get 2 Monopoly codes for free just for signing up. Terms apply.</p>
    </div>
  </div>

  <div class="container">
    <img src="images/mcmethods26.png" alt="McMethods Logo" class="logo">

    <!-- Title -->
    <h1>Welcome to McMethods</h1>

    <!-- Vertical Buttons -->
    <div class="vertical-buttons">
      <a class="button" href="deals.html">Deals</a>
      <a class="button" href="order.html">Order</a>
    </div>

    <!-- Buttons -->
    <div class="button-container">
      <a class="button" href="login.html" style="text-align: center;">Log in</a>
      <a class="button" href="signup.html">Create Account</a>
      <a class="button" href="">Reset Password</a>
    </div>
  </div>

  <script>
    // Get modal elements
    const modal = document.getElementById('modal-overlay');
    const closeBtn = document.querySelector('.close-button');

    // Function to show modal
    function showModal() {
      modal.style.display = 'flex';
    }

    // Function to hide modal
    function hideModal() {
      modal.style.display = 'none';
    }

    // Show modal on page load
    window.addEventListener('load', showModal);

    // Close modal when clicking the X button
    closeBtn.addEventListener('click', hideModal);

    // Close modal when clicking outside the modal content
    modal.addEventListener('click', function(event) {
      if (event.target === modal) {
        hideModal();
      }
    });
  </script>
</body>
</html>
