<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success! - McMethods</title>
  <!-- Montserrat font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      background: rgba(0,0,0,0.65);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      color: white;
      max-width: 400px;
      width: 90%;
    }

    .logo {
      width: 120px;
      height: auto;
      border-radius: 25px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    input[type="text"], input[type="password"] {
      padding: 0.8rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
    }

    button {
      background: #fbc02d; /* McDonald's golden yellow */
      color: #b71c1c;       /* McDonald's deep red */
      padding: 0.9rem 2rem;
      border-radius: 10px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #f9a825; /* Darker yellow on hover */
    }

    /* Hide AuthPro badge */
    *[class*="authpro"], *[id*="authpro"] {
      display: none !important;
    }

    /* Hide AuthPro bar by targeting link */
    a[href*="authpro.com"] {
      display: none !important;
    }
    a[href*="authpro.com"] > * {
      display: none !important;
    }
    a[href*="authpro.com"]::before,
    a[href*="authpro.com"]::after {
      display: none !important;
    }

    </style>
</head>
<body>
  <div class="container">

    <h1>Logout Successful</h1>
      <div class="Order">
        <a href="index.html" class="button">Return Home</a>
        <a href="login.html" class="button">Login</a>
      </div>

  <style>
    a.button {
      text-decoration: none;
      background: #fbc02d; /* McDonald's golden yellow */
      color: #b71c1c;       /* McDonald's deep red */
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.25s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      text-align: center;
      display: inline-block;
    }

    a.button:hover {
      background: #ffd54f;
      transform: scale(1.05);
    }

    button.button {
      text-decoration: none;
      background: #fbc02d; /* McDonald's golden yellow */
      color: #b71c1c;       /* McDonald's deep red */
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.25s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      text-align: center;
      display: inline-block;
      border: none;
      cursor: pointer;
    }

    button.button:hover {
      background: #ffd54f;
      transform: scale(1.05);
    }

    /* Position the invisible "Protected by" bar at the top so it doesn't interfere */
    a[href*="authpro.com"], a[href*="authpro.com"] > *, a[href*="authpro.com"]::before, a[href*="authpro.com"]::after {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 20px !important;
      overflow: hidden !important;
      pointer-events: none !important;
      z-index: 9999 !important;
      opacity: 0 !important;
    }
  </style>
</body>
</html>
